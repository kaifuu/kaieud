server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/edu_course?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: false

edu:
  jwt:
    secret: edu-course-management-system-secret-key-2026
    expire-hours: 24
    # 企业数据物理清除（回收站）安全配置：超级秘钥以 3DES 密文存储，运行时解密比对
    purge:
      # 3DES 密钥（24字节，生产环境建议改由环境变量/配置中心注入）
      crypto-key: "Edu2026TenantPurge3Des!!"
      # 超级秘钥密文（DESede/ECB/PKCS5Padding + Base64）
      secret-cipher: "1wIQOwJtyNGCpwa8b6EHUqeW96jUeOHf"
